<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <!-- Khoá zoom (pinch/double-tap) và tràn viền an toàn (notch) trên điện thoại -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Cho phép "Thêm vào Màn hình chính" chạy như app riêng, không thanh địa chỉ -->
    <meta name="theme-color" content="#FAF9F5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default": chữ thanh trạng thái màu tối, đọc được trên nền kem sáng (black-translucent sẽ cho chữ trắng, bị chìm) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Việc Của Tôi" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <title>Việc Của Tôi</title>

    <!-- Phông chữ dùng chung với app Nhật Ký Giao Dịch: Plus Jakarta Sans + JetBrains Mono (đủ tiếng Việt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      html {
        height: 100%;
        /* Chặn phóng to bằng cử chỉ trên các trình duyệt hỗ trợ (Safari/Chrome mobile) */
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #faf9f5;
        /* Bỏ hiệu ứng "bật" viền khi kéo quá đầu/cuối trang trên mobile */
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        min-height: 100%;
      }
      /* Bỏ viền xanh/xám khi chạm vào nút, link trên mobile */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      img,
      button {
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
